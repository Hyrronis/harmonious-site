<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace organisateur · Harmonious</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120806">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body{padding-top:0}
  .adm-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#0e0605;position:sticky;top:0;z-index:5}
  .adm-top h1{font-family:Cinzel,serif;font-size:1.1rem;margin:0;flex:1}
  .tabs{display:flex;gap:6px;padding:14px 0}
  .tabs button{border:1px solid var(--line);background:transparent;color:var(--cream);padding:.55rem 1rem;border-radius:999px;font-weight:700}
  .tabs button[aria-selected="true"]{background:var(--gold);color:#2a1406;border-color:var(--gold)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
  .stat span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat b{font-family:Cinzel,serif;font-size:1.35rem;color:var(--gold2)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .toolbar input,.toolbar select{padding:.6rem .9rem;border-radius:10px;border:1px solid var(--line);background:#160a07;color:var(--cream);font:inherit;font-size:16px}
  .toolbar input{flex:1 1 220px}
  .list{display:grid;gap:10px}
  .row{display:grid;grid-template-columns:1.1fr 1.3fr .8fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
  .row small{color:var(--muted)}
  .row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:820px){.row{grid-template-columns:1fr}.row .acts{justify-content:flex-start}}
  .code{font-family:Cinzel,serif;font-weight:800;color:var(--gold2)}
  .status{margin:0}
  .scan-box{max-width:520px;margin:0 auto}
  #reader{border-radius:14px;overflow:hidden;background:#000;margin:12px 0}
  .result{padding:22px;border-radius:16px;text-align:center;margin-top:12px;font-weight:700}
  .result h3{margin:0 0 .4rem;font-family:Cinzel,serif;font-size:1.6rem}
  .r-ok{background:rgba(63,191,109,.18);border:2px solid var(--ok)}
  .r-warn{background:rgba(240,166,58,.15);border:2px solid var(--warn)}
  .r-bad{background:rgba(226,81,74,.15);border:2px solid var(--bad)}
  .login{max-width:380px;margin:12vh auto;padding:28px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="login" class="panel login">
  <p class="eyebrow">Harmonious Chorale</p>
  <h1 class="title-sm">Espace organisateur</h1>
  <form id="login-form">
    <label class="field"><span>Identifiant</span><input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="field"><span>Mot de passe</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-gold btn-block" type="submit">Entrer</button>
    <p class="form-error" id="login-error" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="adm-top">
    <h1>Harmonious · Organisateur <small id="me" class="muted" style="font-family:Montserrat,sans-serif;font-size:.8rem;font-weight:500"></small></h1>
    <button class="btn btn-ghost btn-sm" id="reload">Actualiser</button>
    <button class="btn btn-ghost btn-sm" id="logout">Quitter</button>
  </header>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="resa">Réservations</button>
      <button role="tab" aria-selected="false" data-tab="scan">Contrôle d'entrée</button>
      <button role="tab" aria-selected="false" data-tab="compte">Mon compte</button>
      <button role="tab" aria-selected="false" data-tab="equipe" id="tab-btn-equipe" hidden>Équipe</button>
    </div>

    <section id="tab-resa">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Rechercher un nom, un numéro, un code…">
        <select id="f-status"><option value="">Tous les statuts</option><option value="en_attente">À contacter</option><option value="paye">Confirmé</option><option value="annule">Annulé</option></select>
        <select id="f-event"><option value="">Tous les événements</option><option value="gala">Dîner Gala</option><option value="concert">Grand Concert</option></select>
        <button class="btn btn-ghost btn-sm" id="export">Exporter CSV</button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section id="tab-scan" hidden>
      <div class="scan-box">
        <div class="toolbar">
          <select id="scan-event" aria-label="Événement contrôlé"><option value="gala">Dîner Gala · 24 déc.</option><option value="concert">Grand Concert · 25 déc.</option></select>
          <button class="btn btn-gold btn-sm" id="scan-start">Ouvrir la caméra</button>
        </div>
        <div id="reader"></div>
        <form class="toolbar" id="manual-form">
          <input name="code" placeholder="Saisir un code HC-XXXXXX" autocapitalize="characters">
          <button class="btn btn-ghost btn-sm" type="submit">Valider</button>
        </form>
        <div id="scan-result" aria-live="assertive"></div>
      </div>
    </section>
    <section id="tab-compte" hidden>
      <div class="panel" style="max-width:460px">
        <h2 class="title-sm">Changer mon mot de passe</h2>
        <form id="pwd-form">
          <label class="field"><span>Mot de passe actuel</span><input name="old" type="password" required autocomplete="current-password"></label>
          <label class="field"><span>Nouveau mot de passe (10 caractères minimum)</span><input name="new1" type="password" required minlength="10" autocomplete="new-password"></label>
          <label class="field"><span>Confirmer le nouveau mot de passe</span><input name="new2" type="password" required minlength="10" autocomplete="new-password"></label>
          <button class="btn btn-gold" type="submit">Enregistrer</button>
          <p class="form-error" id="pwd-msg" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="tab-equipe" hidden>
      <div class="panel" style="margin-bottom:16px">
        <h2 class="title-sm">Ajouter ou modifier un membre</h2>
        <form id="acc-form" class="toolbar" style="align-items:flex-end">
          <label class="field" style="flex:1 1 160px;margin:0"><span>Identifiant</span><input name="username" required pattern="[a-z0-9._-]{3,32}" placeholder="ex. awa.k" autocapitalize="none"></label>
          <label class="field" style="flex:1 1 160px;margin:0"><span>Nom affiché</span><input name="name" placeholder="Awa K."></label>
          <label class="field" style="flex:1 1 160px;margin:0"><span>Mot de passe</span><input name="password" type="text" placeholder="10 caractères min." autocomplete="off"></label>
          <select name="role" aria-label="Rôle"><option value="staff">Équipe</option><option value="admin">Administrateur</option></select>
          <select name="active" aria-label="État"><option value="true">Actif</option><option value="false">Désactivé</option></select>
          <button class="btn btn-gold btn-sm" type="submit">Enregistrer</button>
        </form>
        <p class="tiny muted" style="margin:.6rem 0 0">Pour modifier un compte existant, saisissez son identifiant. Laissez le mot de passe vide pour ne pas le changer.</p>
        <p class="form-error" id="acc-msg" role="alert"></p>
      </div>
      <div class="list" id="accounts"></div>
      <h2 class="title-sm" style="margin-top:24px">Journal des actions</h2>
      <div class="list" id="audit"></div>
    </section>
  </div>
</div>

<script src="/vendor/html5-qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
